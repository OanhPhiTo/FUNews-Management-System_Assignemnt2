spring.application.name=assignment2
server.port=8080

# ===================================================================
# MS SQL SERVER CONFIGURATION
# Database: assignment2, Port: 1433 (TCP truc tiep, khong can SQL Browser)
# ===================================================================
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=assignment2;encrypt=true;trustServerCertificate=true;
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# Hibernate & JPA Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# Jackson Date Format
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=Asia/Ho_Chi_Minh
